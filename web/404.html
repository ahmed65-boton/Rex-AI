<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09090b">
  <title>404 · Rex AI</title>
  <style>
    :root {
      color-scheme: dark;
      --bg-main: #09090b;
      --bg-sidebar: #09090b;
      --bg-surface: #18181b;
      --bg-surface-hover: #27272a;
      --border: #27272a;
      --border-focus: #3f3f46;
      --text-main: #ededed;
      --text-muted: #a1a1aa;
      --accent: #00d2b6;
      --accent-hover: #00e6c8;
      --accent-text: #042f29;
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;
      --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    [data-appearance="light"] {
      color-scheme: light;
      --bg-main: #fff;
      --bg-sidebar: #f8fafc;
      --bg-surface: #f1f5f9;
      --bg-surface-hover: #e2e8f0;
      --border: #e2e8f0;
      --border-focus: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #0f766e;
      --accent-hover: #115e59;
      --accent-text: #fff;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg-main);
      color: var(--text-main);
      font: 14px/1.5 var(--font-sans);
    }
    header {
      height: 64px;
      display: flex;
      align-items: center;
      padding: 0 24px;
      border-bottom: 1px solid var(--border);
    }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 18px; }
    .brand-mark {
      width: 32px; height: 32px; display: grid; place-items: center;
      border-radius: var(--radius-md); background: var(--accent);
      color: var(--accent-text); font-weight: 750; font-size: 17px;
    }
    .brand-name { font-weight: 650; letter-spacing: -.025em; }
    .brand-name span { color: var(--text-muted); font-weight: 450; margin-left: 3px; }
    main {
      width: min(100% - 40px, 680px);
      min-height: calc(100vh - 65px);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 64px 0 100px;
    }
    .status {
      color: var(--accent);
      font: 12px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: .04em;
      margin-bottom: 14px;
    }
    h1 { font-size: clamp(28px, 5vw, 38px); line-height: 1.2; letter-spacing: -.04em; font-weight: 650; margin: 0 0 12px; }
    p { max-width: 440px; color: var(--text-muted); font-size: 15px; margin: 0; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
    a {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 38px; padding: 0 14px; border: 1px solid var(--border);
      border-radius: var(--radius-md); color: var(--text-main);
      text-decoration: none; font: 500 14px var(--font-sans);
      transition: background .12s ease, border-color .12s ease;
    }
    a:hover { background: var(--bg-surface-hover); border-color: var(--border-focus); }
    a.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
    a.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    @media (max-width: 480px) { header { padding: 0 16px; } main { width: calc(100% - 32px); } }
    @media (prefers-reduced-motion: reduce) { a { transition: none; } }
  </style>
</head>
<body>
  <header>
    <div class="brand" aria-label="Rex AI">
      <div class="brand-mark" aria-hidden="true">R</div>
      <div class="brand-name">Rex<span>AI</span></div>
    </div>
  </header>
  <main>
    <div class="status">ERROR 404</div>
    <h1>Page not found</h1>
    <p>This address doesn’t point to a page in Rex AI.</p>
    <div class="actions">
      <a class="primary" href="/index.html">Go to Rex AI</a>
      <a href="/index.html" onclick="if (history.length > 1) { history.back(); return false; }">Go back</a>
    </div>
  </main>
</body>
</html>
